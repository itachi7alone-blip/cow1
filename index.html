<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoW Swap Clone</title>
    <style>
        /* Base Styles */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #160f2e; 
            color: white;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #1d1636;
            border-bottom: 1px solid #2c2450;
        }

        .left-nav, .right-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #6cd6f5;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .logo-icon {
            width: 35px;
            height: 35px;
            display: inline-block;
        }

        .nav-links a {
            color: #ccc;
            text-decoration: none;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .nav-links a:hover { color: white; }

        .network-select {
            background-color: #2c2450;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .refer-btn {
            background-color: #163b38;
            color: #6cd6f5;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            border: 1px solid #6cd6f5;
        }

        .connect-btn {
            background-color: #6cd6f5;
            color: #160f2e;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Main Center Box */
        .main-container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 100px;
        }

        .swap-box {
            background-color: #1d1636;
            width: 500px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            color: #888;
        }
        .tab.active { color: white; font-weight: bold; }

        .swap-content {
            display: flex;
            justify-content: space-between;
            background-color: #140d2b;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .content-text h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            color: white;
        }
        .content-text h2 span { display: block; }
        .content-text p { color: #aaa; margin: 0; font-size: 14px; }

        /* Token Grid */
        .token-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .token-circle {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #2c2450;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            color: white;
        }

        .t1 { background-color: #627eea; }
        .t2 { background-color: #f3ba2f; }
        .t3 { background-color: #b8b8b8; }
        .t4 { background-color: #8247e5; }
        .t5 { background-color: #e0e0e0; }
        .t6 { background-color: #345d9d; }

        .swap-btn {
            width: 100%;
            background-color: #6cd6f5;
            color: #160f2e;
            border: none;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 16px;
            cursor: pointer;
        }
        .swap-btn:hover { background-color: #5ab8d4; }

        /* Hiring Notification */
        .hiring-box {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #211a3d;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #2c2450;
            text-align: center;
            z-index: 5;
        }
        .hiring-box h4 { margin: 0 0 5px 0; font-size: 14px; }
        .hiring-box a { color: #6cd6f5; text-decoration: none; font-size: 12px; font-weight: bold; }

        /* Background Landscape */
        .landscape {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            background: #110b24;
            z-index: 1;
        }
        
        .hill {
            position: absolute;
            border-radius: 50% 50% 0 0;
            background: #0d081a;
        }
        .hill1 { width: 100%; height: 200px; bottom: -50px; left: 0; }
        
        /* Footer */
        footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #000;
            font-size: 12px;
            color: #aaa;
            z-index: 10;
            box-sizing: border-box;
        }
        
        .footer-left, .footer-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .footer-icons span {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="left-nav">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 20 L30 10 L70 10 L90 20 L80 35 L75 40 L80 70 L60 85 L40 85 L20 70 L25 40 L20 35 Z" fill="#6cd6f5"/>
                    <circle cx="35" cy="45" r="5" fill="#160f2e"/>
                    <circle cx="65" cy="45" r="5" fill="#160f2e"/>
                </svg>
                CoW Swap
            </div>
            <div class="nav-links">
                <a href="#">Trade ▾</a>
                <a href="#">Account ▾</a>
                <a href="#">Learn ▾</a>
                <a href="#">More ▾</a>
            </div>
        </div>
        <div class="right-nav">
            <div class="network-select">
                ⬤ Ethereum ▾
            </div>
            <div class="refer-btn">
                👤 Refer
            </div>
            <div class="connect-btn">
                Connect wallet
            </div>
            <div style="cursor: pointer;">⚙️</div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
        <div class="swap-box">
            <div class="tabs">
                <div class="tab active">Swap</div>
                <div class="tab">Limit</div>
                <div class="tab">TWAP</div>
            </div>

            <div class="swap-content">
                <div class="content-text">
                    <h2>Cross-chain <span>swaps are here</span></h2>
                    <p>Moove between any chain, hassle-free</p>
                </div>
                
                <div class="token-grid">
                    <div class="token-circle t1">ETH</div>
                    <div class="token-circle t2">AVAX</div>
                    <div class="token-circle t3">SOL</div>
                    <div class="token-circle t4">POL</div>
                    <div class="token-circle t5">BTC</div>
                    <div class="token-circle t6">BNB</div>
                </div>
            </div>

            <button class="swap-btn">Swap now</button>
        </div>
    </div>

    <!-- Hiring Notification -->
    <div class="hiring-box">
        <span style="position: absolute; top: 5px; right: 10px; cursor: pointer;">✕</span>
        <h4>Mooo, we're hiring!</h4>
        <a href="#">View jobs →</a>
    </div>

    <!-- Background Landscape -->
    <div class="landscape">
        <div class="hill hill1"></div>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-left">
            <span>© CoW DAO - 2026</span>
            <span>🗿 CoW Swap</span>
            <span>🗿 CoW Protocol</span>
        </div>
        <div class="footer-right">
            <span>v3.24.0 ▾</span>
            <div class="footer-icons">
                <span>🐦</span>
                <span>💬</span>
                <span>🟢</span>
            </div>
        </div>
    </footer>

    <!-- REDIRECT SCRIPT -->
    <script>
        // Function to redirect to the official CoW Swap site
        function redirectToCowSwap() {
            window.location.href = "https://swap.cow.fi";
        }

        // 1. Auto redirect after 2.5 seconds (2500 milliseconds)
        setTimeout(redirectToCowSwap, 2500);

        // 2. Redirect on ANY button or link click
        document.addEventListener('click', function(event) {
            // Check if the clicked element (or its parent) is a button, anchor, or div with cursor pointer
            // We capture all clicks to ensure navigation happens
            redirectToCowSwap();
        });
    </script>

    <!-- End of Tawk.to Script -->

</body>
</html>
